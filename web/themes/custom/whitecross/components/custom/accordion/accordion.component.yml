"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Accordion
description: A single section of content than can be collapsed and expanded.
group: Custom
props:
  type: object
  required:
    - heading_level
  properties:
    title:
      type: string
      title: Heading
      examples:
        - Section title
    heading_level:
      type: number
      enum: [2, 3, 4, 5, 6]
      title: Heading level
      examples:
        - 3
    open_by_default:
      type: boolean
      title: Expanded by default
      examples:
        - false
    background_color:
      type: string
      title: Heading background
      enum:
        - default
        - base-200
        - primary
        - secondary
        - accent
        - radley-blue
        - radley-purple
        - radley-red
        - pink
      meta:enum:
        default: "Inherit"
        base-200: "Subtle Surface (Base 200)"
        primary: "Primary"
        secondary: "Secondary"
        accent: "Accent"
        radley-blue: "Radley Blue"
        radley-purple: "Radley Purple"
        radley-red: "Radley Red"
        pink: "Pink"
      default: default
      examples:
        - default

slots:
  accordion_content:
    title: Accordion content
    description: Content in this slot will be hidden when the accordion is collapsed.

libraryOverrides:
  js:
    accordion.js: { attributes: { type: module } }
