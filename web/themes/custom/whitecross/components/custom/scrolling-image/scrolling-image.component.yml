$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Scrolling Image
group: Base
status: stable
props:
  type: object
  required:
    - media
  properties:
    media:
      $ref: json-schema-definitions://canvas.module/image
      title: Background Image
      type: object
      examples:
        - src: "sites/default/files/images/water-tree.jpg"
          alt: "A beautiful water tree"

slots:
  scrolling_image_slot:
    title: Content

libraryOverrides:
  js:
    scrolling-image.js: { attributes: { type: module } }
