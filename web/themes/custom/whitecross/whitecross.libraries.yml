global:
  version: VERSION
  css:
    theme:
      src/fonts.css:
        preprocess: false
      build/main.min.css:
        # Avoid attempting to re-minify main.min.css. Also ensure it's served in
        # its own right so that browsers only download it once, instead of via
        # aggregates where it may get duplicated across files.
        preprocess: false
        minified: true
      src/theme.css:
        preprocess: false

  js:
    https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js: { external: true }
  dependencies:
    - whitecross/cormorant-garamond

messages:
  version: VERSION
  js:
    lib/messages.js: {}
  dependencies:
    - core/drupal
    - core/once

home:
  version: 060925
  js:
    js/gsap/home-lotus.js: {}
  dependencies:
    - core/drupal

cormorant-garamond:
  version: VERSION
  css:
    theme:
      src/fonts.css: { preprocess: false }


background-gradient-changer:
  version: VERSION
  js:
    components/custom/background-gradient-changer/background-gradient-changer.js: {}
  dependencies:
    - core/drupal

